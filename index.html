<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B1638">
<title>AI Desk</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="ai-192.png">
<link rel="apple-touch-icon" href="ai-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#1B1638; --panel:#241D47; --panel-raised:#2E2657;
    --ruled:rgba(246,238,227,0.07); --hairline:rgba(246,238,227,0.13);
    --ink:#F7EFE4; --ink-dim:#BDB3D6; --ink-faint:#8A80AD;
    --brass:#F5C96B; --moss:#7FD1AE; --rust:#F7848F; --blue:#8EC7EC; --plum:#B3A4F5;
    --ok:#7FD1AE; --warn:#F2B347; --fail:#FF6B7A; --idle:#8A80AD;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Source Serif 4','Iowan Old Style',Georgia,serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
  a{color:var(--brass)}
  button{font:inherit;color:inherit}
  .shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  /* ---- sidebar ---- */
  nav{background:var(--panel);border-right:1px solid var(--hairline);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-family:var(--font-display);font-size:22px;font-weight:600;padding:0 8px 2px}
  .brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);padding:0 8px 16px;letter-spacing:.04em}
  .search{width:100%;background:var(--paper);border:1px solid var(--hairline);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--font-mono);font-size:13px;margin-bottom:14px}
  .search:focus{outline:2px solid var(--brass);outline-offset:1px}
  .sec{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink-dim);font-size:15px}
  .sec:hover{background:var(--panel-raised);color:var(--ink)}
  .sec.on{background:var(--panel-raised);color:var(--ink);box-shadow:inset 3px 0 0 var(--sec-colour,var(--brass))}
  .sec .dot{width:8px;height:8px;border-radius:50%;background:var(--sec-colour,var(--brass));flex:none}
  .sec .n{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
  .navfoot{margin-top:18px;padding:12px 8px 0;border-top:1px solid var(--ruled);font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
  .navfoot .apps{margin-top:10px}
  .navfoot .apps a{color:var(--ink-dim)}
  .navfoot button{background:none;border:1px solid var(--hairline);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink-dim);font-family:var(--font-mono);font-size:11px;margin-top:6px}
  /* ---- main ---- */
  main{display:grid;grid-template-columns:minmax(220px,320px) 1fr;min-width:0}
  .list{border-right:1px solid var(--hairline);padding:20px 14px;overflow:auto;height:100vh;position:sticky;top:0}
  .list h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 6px 4px}
  .list .blurb{color:var(--ink-faint);font-size:13px;margin:0 6px 14px}
  .item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:4px}
  .item:hover{background:var(--panel)}
  .item.on{background:var(--panel);border-color:var(--hairline)}
  .item .t{font-size:15px;line-height:1.3}
  .item .m{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-top:3px}
  .detail{padding:28px 36px 60px;min-width:0;max-width:880px}
  .detail.wide{max-width:1240px}
  .detail.wide .body{max-width:808px}
  .crumb{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec-colour,var(--brass))}
  .detail h1{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.15;margin:6px 0 4px}
  .meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin-bottom:18px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .chip{background:var(--panel);border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink-dim)}
  .chip:hover{color:var(--ink);border-color:var(--brass)}
  .body h2{font-family:var(--font-display);font-weight:600;font-size:21px;margin:26px 0 6px;padding-top:6px;border-top:1px solid var(--ruled);scroll-margin-top:16px}
  .body h3{font-size:17px;margin:18px 0 4px}
  .body ul{padding-left:22px;margin:6px 0}
  .body li{margin:3px 0}
  .body p{margin:8px 0}
  .body blockquote{margin:12px 0;padding:12px 16px;background:var(--panel);border-left:3px solid var(--brass);border-radius:6px;position:relative}
  .body blockquote .copy{position:absolute;top:8px;right:8px;background:var(--panel-raised);border:1px solid var(--hairline);border-radius:6px;font-family:var(--font-mono);font-size:11px;padding:3px 8px;cursor:pointer;color:var(--ink-dim)}
  .body code{font-family:var(--font-mono);font-size:.9em;background:var(--panel);padding:1px 5px;border-radius:4px}
  .tbl{overflow-x:auto;margin:12px 0}
  .body table{border-collapse:collapse;font-size:14px;min-width:520px}
  .body th,.body td{border-bottom:1px solid var(--hairline);padding:7px 10px;text-align:left;vertical-align:top}
  .body th{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim)}
  .empty{color:var(--ink-faint);padding:40px 0}
  /* ---- system health ---- */
  .hdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--st);flex:none;margin-right:7px;vertical-align:1px}
  .hdot.paused{background:none;box-shadow:inset 0 0 0 1.5px var(--ink-faint)}
  .item.paused{opacity:.55}
  .cloud{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;color:var(--blue);border:1px solid var(--blue);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
  .hbar{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin:0 6px 12px}
  .hbar button{background:none;border:1px solid var(--hairline);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--ink-dim);font-family:var(--font-mono);font-size:11px;margin-top:6px}
  .key{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;margin:12px 0}
  .key .hdot{margin-top:6px}
  .item .t{overflow-wrap:anywhere}
  .htbl table{min-width:0;width:100%}
  .htbl th{white-space:nowrap;width:1%}
  .backbtn{display:none}
  .navgroup{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:14px 10px 4px;border-top:1px solid var(--ruled);margin-top:10px}
  /* ---- model scores ---- */
  .sc-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
  .sc-bar button{background:var(--panel);border:1px solid var(--hairline);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-dim)}
  .sc-bar button.on{color:var(--paper);background:var(--brass);border-color:var(--brass)}
  .sc-bar label{font-size:13px;color:var(--ink-dim);display:flex;gap:6px;align-items:center;margin-left:auto;cursor:pointer}
  .sc .tbl{margin:0 0 8px}
  .sc table{border-collapse:separate;border-spacing:2px;font-size:13px;min-width:0}
  .sc th,.sc td{border:0;padding:6px 5px;text-align:center;white-space:nowrap}
  .sc th{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim);cursor:pointer;vertical-align:bottom;white-space:normal;min-width:48px;line-height:1.25}
  .sc th.on{color:var(--brass)}
  .sc th.m,.sc td.m{text-align:left;position:sticky;left:0;background:var(--paper);z-index:1;min-width:132px}
  .sc td.m .lab{display:block;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
  .sc td.v{font-family:var(--font-mono);border-radius:5px;background:color-mix(in srgb,var(--moss) var(--h),transparent)}
  .sc td.v.best{box-shadow:inset 0 0 0 1.5px var(--brass);font-weight:600}
  .sc td.v.na{color:var(--ink-faint);background:none}
  .sc tr.ours td.m{box-shadow:inset 3px 0 0 var(--ok)}
  .route{display:inline-block;font-family:var(--font-mono);font-size:10px;border-radius:999px;padding:0 6px;margin-top:2px;border:1px solid currentColor}
  .route.inuse{color:var(--ok)} .route.possible{color:var(--brass)} .route.selfhost{color:var(--blue)} .route.eu{color:var(--plum)}
  .bars{display:grid;grid-template-columns:minmax(120px,170px) 1fr auto;gap:5px 10px;align-items:center;font-size:14px;margin:6px 0 10px}
  .bars .track{height:16px;background:var(--panel);border-radius:4px;overflow:hidden}
  .bars .fill{height:100%;background:var(--moss);border-radius:4px}
  .bars .ours .fill{background:var(--ok)}
  .bars .val{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);text-align:right;min-width:42px}
  .bars .nm.ours{color:var(--ok)}
  .sc-key{font-size:13px;color:var(--ink-faint);margin:0 0 6px}
  .body pre{background:var(--panel);padding:10px 12px;border-radius:6px;overflow-x:auto;font-size:12px}
  /* ---- unlock ---- */
  .unlock{max-width:420px;margin:12vh auto;padding:28px;background:var(--panel);border:1px solid var(--hairline);border-radius:14px}
  .unlock h1{font-family:var(--font-display);margin:0 0 8px}
  .unlock p{color:var(--ink-dim);font-size:14px}
  .unlock input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--hairline);background:var(--paper);color:var(--ink);font-family:var(--font-mono)}
  .unlock button{margin-top:12px;padding:9px 16px;border-radius:8px;border:0;background:var(--brass);color:#1B1638;font-weight:600;cursor:pointer}
  .err{color:var(--rust);font-size:14px;min-height:1.4em}
  /* ---- phone ---- */
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start}
    .navlist{scrollbar-width:none}
    .navlist::-webkit-scrollbar{display:none}
    main{align-content:start}
    nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hairline);padding:14px 16px}
    .navlist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .sec{white-space:nowrap;width:auto;padding:7px 10px}
    .sec .n{display:none}
    .navgroup{border-top:0;border-left:1px solid var(--hairline);margin:0 0 0 6px;padding:9px 4px 0 12px;white-space:nowrap}
    .bars{grid-template-columns:minmax(90px,120px) 1fr auto}
    .navfoot{display:none}
    main{grid-template-columns:1fr}
    .list{height:auto;position:static;border-right:0;padding:14px 16px}
    .detail{padding:18px 16px 60px}
    main.reading .list{display:none}
    main:not(.reading) .detail{display:none}
    .backbtn{display:inline-block;background:none;border:1px solid var(--hairline);border-radius:6px;padding:4px 10px;font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);margin-bottom:10px;cursor:pointer}
  }
</style>
</head>
<body>
<div id="app"><div class="unlock">
  <h1>AI Desk</h1>
  <p>Shared AI research and notes. Enter the passphrase you were given.</p>
  <form id="unlock">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passphrase" autofocus>
    <label style="display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:14px;color:var(--ink-dim)"><input id="remember" type="checkbox" checked style="width:auto"> Remember on this device</label>
    <div class="err" id="msg"></div>
    <button type="submit">Unlock</button>
  </form>
</div></div>

const store = { get(k){try{return localStorage.getItem(k)}catch(_){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(_){}}, del(k){try{localStorage.removeItem(k)}catch(_){}} };
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlockWith(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", hash:"SHA-256", salt:bytes(VAULT.salt), iterations:VAULT.iter }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:bytes(VAULT.iv) }, key, bytes(VAULT.ct))));
  document.body.innerHTML = p.html;
  const s = document.createElement("script"); s.textContent = p.js; document.body.appendChild(s);
}
const msg = document.getElementById("msg");
document.getElementById("unlock").addEventListener("submit", async e => {
  e.preventDefault(); const pw = document.getElementById("pw").value.trim(), keep = document.getElementById("remember").checked; msg.textContent = "Unlocking…";
  try { await unlockWith(pw); if (keep) store.set("aidesk-pass", pw); }
  catch(_) { msg.textContent = "That passphrase didn\u2019t work."; }
});
const saved = store.get("aidesk-pass");
if (saved) unlockWith(saved).catch(() => store.del("aidesk-pass"));
